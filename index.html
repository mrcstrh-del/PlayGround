<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ringfall: Outpost</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07110e;color:#effff7;font-family:"Arial Black",Impact,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px 2px #000}#title{position:absolute;left:24px;top:20px;font-size:clamp(14px,2vw,24px);letter-spacing:2px;color:#aee7cf}#title b{color:#8edbff}
#crosshair{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:1.5px solid rgba(230,255,244,.9);border-radius:50%;pointer-events:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#eafff5}.crossh:before{left:15px;top:-8px;width:2px;height:48px}.crossh:after{left:-8px;top:15px;height:2px;width:48px}
#crosshair i{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:13px;top:13px}
#bars{position:absolute;left:28px;bottom:32px;width:230px}#health,#shield{height:16px;margin:7px 0;background:rgba(10,20,18,.72);border:2px solid rgba(210,255,231,.65);transform:skewX(-12deg)}#health i,#shield i{display:block;height:100%;width:100%;transition:.15s}.label{position:absolute;left:-18px;transform:translateY(-2px) skewX(12deg);font:12px monospace}#health i{background:#65d96e}#shield i{background:#6bc7ff}
#ammo{position:absolute;right:36px;bottom:26px;text-align:right}#ammo strong{font-size:52px;line-height:.8}#ammo span{color:#bad6c8;font:16px monospace}
#minimap{position:absolute;right:24px;top:24px;width:150px;height:150px;border:2px solid rgba(183,229,210,.7);border-radius:50%;background:rgba(8,35,28,.62);overflow:hidden}#minimap:before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;background:#fff;border-radius:50%;z-index:2}.map-enemy{position:absolute;width:5px;height:5px;border-radius:50%;background:#ff715f;box-shadow:0 0 5px #ff5c4d}
#message{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:clamp(18px,3vw,38px);text-align:center;letter-spacing:3px;display:none}.mission{position:absolute;left:28px;top:72px;color:#d9efe5;font:14px monospace;line-height:1.7}.mission b{color:#8af0b1}
#start,#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(42,91,72,.25),rgba(4,10,8,.92));z-index:20;text-align:center;pointer-events:auto}#start h1,#end h1{font-size:clamp(38px,7vw,86px);margin:0;color:#dfffea;letter-spacing:-2px;text-shadow:0 6px 0 #1a4a39}#start h2,#end h2{color:#83cfaa;letter-spacing:8px;margin:10px 0 30px}.startbtn{border:2px solid #a3dfc2;background:rgba(24,74,55,.72);color:white;padding:15px 28px;font:18px "Arial Black";letter-spacing:2px;cursor:pointer}#end{display:none}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font:16px monospace;color:#ffe7a3;display:none}
#touch{display:none;position:absolute;inset:0;pointer-events:none} .stick{position:absolute;bottom:45px;width:130px;height:130px;border:48px solid rgba(200,255,225,.08);border-radius:50%;pointer-events:auto}.stick.left{left:25px}.stick.right{right:25px}.fire{position:absolute;right:25px;bottom:190px;width:82px;height:82px;border:3px solid rgba(255,220,180,.7);border-radius:50%;background:rgba(255,120,70,.15);pointer-events:auto;text-align:center;font:42px/76px Arial}
@media(hover:none),(pointer:coarse){#touch{display:block}#crosshair{width:24px;height:24px}.crossh:before{left:11px;top:-5px;height:34px}.crossh:after{left:-5px;top:11px;width:34px}#bars{bottom:20px;left:70px;width:150px}#ammo{right:24px;bottom:20px}#ammo strong{font-size:38px}#minimap{width:100px;height:100px}#controlsHint{font-size:0!important;line-height:1.5;max-width:90vw}#controlsHint:after{content:"LEFT STICK MOVE · RIGHT STICK AIM · HOLD FIRE TO SHOOT";font:11px monospace;letter-spacing:1px}}
</style></head>
<body>
<canvas id="c"></canvas><div id="hud"><div id="title"><b>RINGFALL</b> // OUTPOST DEFENSE</div><div id="kills" style="position:absolute;right:24px;top:190px;font:13px monospace;color:#d9efe5">HOSTILES 0 / 9</div><div id="crosshair" class="crossh"><i></i></div><div class="mission">MISSION<br><b>RING OUTPOST</b><br><span id="objective">Eliminate hostile forces</span></div><div id="bars"><div id="shield"><i></i></div><div id="health"><i></i></div></div><div id="ammo"><strong id="rounds">36</strong><br><span>RIFLE / <b id="reserve">180</b></span></div><div id="minimap"></div><div id="message"></div><div id="toast"></div><div id="touch"><div class="stick left" id="moveStick"></div><div class="stick right" id="lookStick"></div><div class="fire" id="fireBtn">•</div></div></div>
<div id="start"><h1>RING OUTPOST</h1><h2>LAST LIGHT</h2><button class="startbtn" id="startBtn">DEPLOY</button><p id="controlsHint" style="font:13px monospace;letter-spacing:1px">WASD MOVE · MOUSE AIM · CLICK FIRE · R RELOAD · SHIFT SPRINT</p></div><div id="end"><h1 id="endTitle">MISSION COMPLETE</h1><h2 id="endSub">OUTPOST SECURED</h2><button class="startbtn" onclick="location.reload()">PLAY AGAIN</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const canvas=document.getElementById('c'), scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x89b9a1,.009);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,700);camera.position.set(0,2.1,18);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.background=new THREE.Color(0x83a99b);scene.add(new THREE.HemisphereLight(0xcdf7ff,0x315542,2));const sun=new THREE.DirectionalLight(0xfff1ba,3);sun.position.set(-40,70,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
// world
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180,40,40),mat(0x3e6347));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<700;i++){const h=1+Math.random()*5;const g=new THREE.Mesh(new THREE.ConeGeometry(.3+Math.random()*.45,h,5),mat(Math.random()>.5?0x56744a:0x31543b));g.position.set((Math.random()-.5)*150,.15+h/2,(Math.random()-.5)*150);g.rotation.z=(Math.random()-.5)*.2;scene.add(g)}
// outpost structures
for(let i=0;i<7;i++){const x=-38+i*12,z=-28-Math.abs(i-3)*2;const b=new THREE.Mesh(new THREE.BoxGeometry(7,4,9),mat(i%2?0x667064:0x7d8275));b.position.set(x,2,z);b.castShadow=b.receiveShadow=true;scene.add(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(7.6,.35,9.6),mat(0x252e29));roof.position.set(x,4.15,z);scene.add(roof)}
// central pylon
for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(1.5+i*.4,2.2+i*.7,14+i*2,8),mat(i%2?0x6e8077:0x8a967f));p.position.set(0,7+i*2,-45-i*5);p.castShadow=true;scene.add(p)}
// path
for(let i=0;i<22;i++){const x=(i%2-.5)*1.8,z=15-i*3;const slab=new THREE.Mesh(new THREE.BoxGeometry(4,.12,3),mat(0x8c977f));slab.position.set(x,.08,z);slab.receiveShadow=true;scene.add(slab)}
// sky ring
const ring=new THREE.Mesh(new THREE.RingGeometry(140,155,64),new THREE.MeshBasicMaterial({color:0xd7dcae,side:THREE.DoubleSide}));ring.position.set(0,95,-180);ring.rotation.x=.12;scene.add(ring);
// extraction beacon
const beacon=new THREE.Group();for(let i=0;i<3;i++){const light=new THREE.Mesh(new THREE.TorusGeometry(2+i*.55,.07,8,32),new THREE.MeshBasicMaterial({color:i===0?0x83ffaf:0x9ce5c2,transparent:true,opacity:.85-i*.15}));light.rotation.x=Math.PI/2;light.position.y=.2+i*.25;beacon.add(light)}const beaconCore=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,3,12),new THREE.MeshBasicMaterial({color:0x8affba}));beaconCore.position.y=1.5;beacon.add(beaconCore);beacon.position.set(0,.05,34);scene.add(beacon);
// weapon viewmodel
const weapon=new THREE.Group();const gunMat=mat(0x1e2724,.25), dark=mat(0x0b100f,.2);const body=new THREE.Mesh(new THREE.BoxGeometry(.16,.22,.9),gunMat);body.position.set(.35,-.28,-.7);weapon.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.65,10),dark);barrel.rotation.x=Math.PI/2;barrel.position.set(.35,-.25,-1.15);weapon.add(barrel);const sight=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.22),gunMat);sight.position.set(.35,-.12,-.72);weapon.add(sight);camera.add(weapon);scene.add(camera);
// enemies
const enemies=[];function makeEnemy(x,z){const g=new THREE.Group();const armor=mat(0x654e38),skin=mat(0x7c4b32);const legs=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.65,4,6),armor);legs.position.y=.7;g.add(legs);const chest=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.65,4,8),armor);chest.position.y=1.55;chest.castShadow=true;g.add(chest);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),skin);head.position.y=2.25;g.add(head);const horn=new THREE.Mesh(new THREE.ConeGeometry(.12,.55,5),mat(0xb4a56b));horn.position.set(0,2.55,0);horn.rotation.z=.15;g.add(horn);g.position.set(x,0,z);g.userData={hp:60,fire:Math.random()*2,hit:0};scene.add(g);enemies.push(g)}
for(let i=0;i<9;i++)makeEnemy(-30+Math.random()*60,-25-Math.random()*35);const mapMarkers=enemies.map(()=>{const dot=document.createElement('i');dot.className='map-enemy';document.getElementById('minimap').append(dot);return dot});
const keys={},mouse={x:0,y:0,down:false};let yaw=0,pitch=0,started=false,gameOver=false,health=100,shield=100,ammo=36,reserve=180,canFire=true,reload=0,kills=0,damageFlash=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reloadNow()});addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){yaw-=e.movementX*.0024;pitch-=e.movementY*.0022;pitch=Math.max(-1.25,Math.min(1.25,pitch))}});
canvas.addEventListener('mousedown',()=>{mouse.down=true;if(started&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});addEventListener('mouseup',()=>mouse.down=false);addEventListener('pointerup',()=>mouse.down=false);addEventListener('pointercancel',()=>mouse.down=false);
function reloadNow(){if(ammo<36&&reserve>0&&!reload&&!gameOver){reload=1.5;toast('RELOADING')}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1000)}
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('start').style.display='none';canvas.requestPointerLock?.()};
// touch
let touchMove={x:0,y:0},touchLook={x:0,y:0};function stick(el,type){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.dataset.pid=e.pointerId});el.addEventListener('pointermove',e=>{if(el.dataset.pid!=e.pointerId)return;const r=el.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2);if(type==='move')touchMove={x,y};else touchLook={x,y}});el.addEventListener('pointerup',()=>{el.dataset.pid='';if(type==='move')touchMove={x:0,y:0};else touchLook={x:0,y:0};})}stick(document.getElementById('moveStick'),'move');stick(document.getElementById('lookStick'),'look');document.getElementById('fireBtn').addEventListener('pointerdown',()=>mouse.down=true);document.getElementById('fireBtn').addEventListener('pointerup',()=>mouse.down=false);
const clock=new THREE.Clock();function update(dt){if(!started||gameOver)return;if(reload){reload-=dt;if(reload<=0){const load=Math.min(36-ammo,reserve);ammo+=load;reserve-=load;reload=0;toast('READY')}}
 yaw-=touchLook.x*dt*1.8;pitch-=touchLook.y*dt*1.3;pitch=Math.max(-1.25,Math.min(1.25,pitch));
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchMove.x,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-touchMove.y;const speed=(keys.ShiftLeft||keys.ShiftRight)?12:7;if(mx||mz){const v=new THREE.Vector3().addScaledVector(right,mx).addScaledVector(forward,mz);if(v.length()>1)v.normalize();camera.position.addScaledVector(v,speed*dt)}camera.position.x=Math.max(-75,Math.min(75,camera.position.x));camera.position.z=Math.max(-72,Math.min(40,camera.position.z));camera.rotation.set(pitch,yaw,0,'YXZ');
 if(mouse.down&&canFire&&ammo>0&&!reload){ammo--;canFire=false;setTimeout(()=>canFire=true,105);weapon.position.z=.08;setTimeout(()=>weapon.position.z=0,70);shoot()}if(ammo===0&&!reload&&reserve>0)reloadNow();
 enemies.forEach(e=>{if(!e.parent)return;const d=e.position.distanceTo(camera.position);if(d<45){const dir=new THREE.Vector3().subVectors(camera.position,e.position);dir.y=0;dir.normalize();if(d>12)e.position.addScaledVector(dir,dt*2.1);e.lookAt(camera.position.x,0,camera.position.z);e.userData.fire-=dt;if(e.userData.fire<=0&&d<32){e.userData.fire=1.2+Math.random()*1.4;damage(2+Math.random()*3)} }});
 weapon.position.x=.01*Math.sin(performance.now()*.008);document.getElementById('rounds').textContent=ammo;document.getElementById('reserve').textContent=reserve;document.getElementById('health').firstElementChild.style.width=health+'%';document.getElementById('shield').firstElementChild.style.width=shield+'%';document.getElementById('objective').textContent=kills>=9?'Reach the green extraction beacon':'Eliminate hostile forces';beacon.rotation.y+=dt*.5;if(kills>=9&&camera.position.distanceTo(beacon.position)<6)end(true);enemies.forEach((e,i)=>{const dot=mapMarkers[i];dot.style.left=`${((e.position.x+75)/150)*100}%`;dot.style.top=`${((e.position.z+75)/150)*100}%`;dot.style.display=e.parent?'block':'none'});
 damageFlash=Math.max(0,damageFlash-dt);renderer.domElement.style.filter=damageFlash?'sepia(.4) saturate(2)':'none';}
function shoot(){const origin=camera.position.clone(),dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);const ray=new THREE.Raycaster(origin,dir,.1,100);const hits=ray.intersectObjects(enemies,true);if(hits.length){let o=hits[0].object;while(o&&o.parent!==scene)o=o.parent;if(o&&enemies.includes(o)){o.userData.hp-=18+Math.random()*12;o.userData.hit=.12;if(o.userData.hp<=0){scene.remove(o);kills++;document.getElementById('kills').textContent='HOSTILES '+kills+' / 9';toast(kills===9?'AREA SECURED — REACH EXTRACTION':'HOSTILE DOWN')}}}
const flash=new THREE.Mesh(new THREE.SphereGeometry(.06),new THREE.MeshBasicMaterial({color:0xffd66a}));flash.position.set(camera.position.x+.3,camera.position.y-.25,camera.position.z-.9);scene.add(flash);setTimeout(()=>scene.remove(flash),40)}
function damage(n){if(gameOver)return;if(shield>0){const s=Math.min(shield,n);shield-=s;n-=s}health=Math.max(0,health-n);document.getElementById('health').firstElementChild.style.width=health+'%';document.getElementById('shield').firstElementChild.style.width=shield+'%';damageFlash=.12;if(health<=0)end(false)}
function end(win){gameOver=true;document.exitPointerLock?.();const end=document.getElementById('end');end.style.display='flex';document.getElementById('endTitle').textContent=win?'MISSION COMPLETE':'MISSION FAILED';document.getElementById('endSub').textContent=win?kills+' HOSTILES ELIMINATED':'OUTPOST OVERRUN'}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);update(dt);enemies.forEach(e=>{if(e.userData.hit>0){e.userData.hit-=dt;e.rotation.z=Math.sin(performance.now()*.02)*.08}else e.rotation.z=0});renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body></html>

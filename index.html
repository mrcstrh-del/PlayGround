<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Rocket Kart League</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081326;font-family:Arial Black,Arial,sans-serif;color:white;touch-action:none}
canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none}
#score{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;font-size:28px;text-shadow:0 3px 0 #111}
#score span{width:58px;text-align:center}.blue{color:#54caff}.orange{color:#ff9e45}.timer{font-size:20px;color:#fff}
#item{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:82px;height:82px;border-radius:50%;border:5px solid #fff;background:linear-gradient(135deg,#ffef66,#f9b700);box-shadow:0 5px 20px #0009,inset 0 0 12px #fff;display:flex;align-items:center;justify-content:center;font-size:34px;text-shadow:0 2px #333}
#itemLabel{position:absolute;bottom:-24px;font-size:12px;color:#fff;white-space:nowrap;text-shadow:0 2px 3px #000}
#boost{position:absolute;bottom:30px;left:28px;width:190px;height:18px;border:3px solid #fff;border-radius:20px;background:#1118;overflow:hidden}#boost>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#27cfff,#fff)}
#notice{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%) scale(.7);font-size:58px;color:#fff;text-shadow:0 5px 0 #09255e,0 0 20px #fff;opacity:0;transition:.25s}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#193667d9,#06101ce8);pointer-events:auto}
.panel{text-align:center}.panel h1{font-size:clamp(38px,7vw,74px);margin:0;text-shadow:0 6px 0 #b34b00}.panel h1 em{color:#ffcf45;font-style:normal}.panel p{font-weight:bold;color:#bfeaff}button{pointer-events:auto;border:4px solid #fff;border-radius:16px;padding:15px 28px;font:900 22px Arial;background:#ff9238;color:white;box-shadow:0 7px 0 #9f3c12,0 10px 30px #0009}button:active{transform:translateY(5px);box-shadow:0 2px 0 #9f3c12}
#controls{display:none}.touch{position:absolute;bottom:18px;width:68px;height:68px;border:3px solid #ffffffaa;border-radius:50%;background:#19457588;pointer-events:auto;font-size:26px;color:white}.left{left:18px}.right{left:98px}.brake{right:100px}.use{right:18px;width:78px;height:78px;background:#d65a1b88}
@media(max-width:900px),(pointer:coarse){#controls{display:block}#boost{bottom:106px;left:18px;width:150px}#item{bottom:112px;width:64px;height:64px}#score{top:10px;font-size:22px;gap:8px}}
</style></head>
<body>
<div id="hud"><div id="score"><b class="blue" id="bs">0</b><span class="timer" id="time">2:00</span><b class="orange" id="os">0</b></div><div id="boost"><i id="boostFill"></i></div><div id="item"><span id="itemIcon">?</span><span id="itemLabel">ITEM BOX</span></div><div id="notice"></div></div>
<div id="start"><div class="panel"><h1>ROCKET <em>KART</em></h1><p>DRIVE • BOOST • SCORE</p><button id="play">KICK OFF</button></div></div>
<div id="controls"><div class="touch left" data-key="left">◀</div><div class="touch right" data-key="right">▶</div><div class="touch brake" data-key="boost">BOOST</div><div class="touch use" data-key="use">⚡</div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
